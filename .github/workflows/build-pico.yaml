name: Build Raspberry Pi Pico

"on":
  pull_request:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-pico.yaml
      - .justfile
      - boards/pico/.cargo/**
      - boards/pico/build.rs
      - boards/pico/memory.x
      - boards/pico/Cargo.lock
      - boards/pico/Cargo.toml
      - boards/pico/**.nix
      - boards/pico/rust-toolchain.toml
      - boards/pico/src/**
      - deny.toml
      - flake.lock
  push:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-pico.yaml
      - .justfile
      - boards/pico/.cargo/**
      - boards/pico/build.rs
      - boards/pico/memory.x
      - boards/pico/Cargo.lock
      - boards/pico/Cargo.toml
      - boards/pico/**.nix
      - boards/pico/rust-toolchain.toml
      - boards/pico/src/**
      - deny.toml
      - flake.lock
  workflow_dispatch:

jobs:
  build-pico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build
        run: nix build --print-build-logs .#pico
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: pwm-fan-controller-pico
          path: |
            result/bin/pwm-fan-controller-pico
            result/bin/pwm-fan-controller-pico.uf2
  check-pico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Lint with Clippy
        run: nix build --print-build-logs .#checks.x86_64-linux.pico-clippy
      - name: Check licenses, bans, and sources with cargo-deny
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.pico-deny
      - name: Audit dependencies for security vulnerabilities with cargo-audit
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.pico-audit
