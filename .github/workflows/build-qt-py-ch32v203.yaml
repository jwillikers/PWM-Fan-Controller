name: Build QT Py CH32V203

"on":
  pull_request:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-qt-py-ch32v203.yaml
      - .justfile
      - boards/qt-py-ch32v203/.cargo/**
      - boards/qt-py-ch32v203/build.rs
      - boards/qt-py-ch32v203/memory.x
      - boards/qt-py-ch32v203/Cargo.lock
      - boards/qt-py-ch32v203/Cargo.toml
      - boards/qt-py-ch32v203/**.nix
      - boards/qt-py-ch32v203/rust-toolchain.toml
      - boards/qt-py-ch32v203/src/**
      - deny.toml
      - flake.lock
  push:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-qt-py-ch32v203.yaml
      - .justfile
      - boards/qt-py-ch32v203/.cargo/**
      - boards/qt-py-ch32v203/build.rs
      - boards/qt-py-ch32v203/memory.x
      - boards/qt-py-ch32v203/Cargo.lock
      - boards/qt-py-ch32v203/Cargo.toml
      - boards/qt-py-ch32v203/**.nix
      - boards/qt-py-ch32v203/rust-toolchain.toml
      - boards/qt-py-ch32v203/src/**
      - deny.toml
      - flake.lock
  workflow_dispatch:

jobs:
  build-qt-py-ch32v203:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build
        run: nix build --print-build-logs .#qt-py-ch32v203
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: pwm-fan-controller-qt-py-ch32v203
          path: |
            result/bin/pwm-fan-controller-qt-py-ch32v203
  check-qt-py-ch32v203:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Lint with Clippy
        run: nix build --print-build-logs .#checks.x86_64-linux.qt-py-ch32v203-clippy
      - name: Check licenses, bans, and sources with cargo-deny
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.qt-py-ch32v203-deny
      - name: Audit dependencies for security vulnerabilities with cargo-audit
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.qt-py-ch32v203-audit
