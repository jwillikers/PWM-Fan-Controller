name: Build ATtiny85

"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-attiny85.yaml
      - .justfile
      - boards/attiny85/.cargo/**
      - boards/attiny85/Cargo.lock
      - boards/attiny85/Cargo.toml
      - boards/attiny85/**.nix
      - boards/attiny85/rust-toolchain.toml
      - boards/attiny85/src/**
      - deny.toml
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-attiny85:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '*.nix'
              - .github/workflows/build-attiny85.yaml
              - .justfile
              - boards/attiny85/.cargo/**
              - boards/attiny85/Cargo.lock
              - boards/attiny85/Cargo.toml
              - boards/attiny85/**.nix
              - boards/attiny85/rust-toolchain.toml
              - boards/attiny85/src/**
              - deny.toml
              - flake.lock
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: nix build --print-build-logs .#attiny85
      - name: Upload firmware
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pwm-fan-controller-attiny85
          path: |
            result/bin/pwm-fan-controller-attiny85.elf
            result/bin/pwm-fan-controller-attiny85.hex
  check-attiny85:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '*.nix'
              - .github/workflows/build-attiny85.yaml
              - .justfile
              - boards/attiny85/.cargo/**
              - boards/attiny85/Cargo.lock
              - boards/attiny85/Cargo.toml
              - boards/attiny85/**.nix
              - boards/attiny85/rust-toolchain.toml
              - boards/attiny85/src/**
              - deny.toml
              - flake.lock
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Lint with Clippy
        if: steps.gate.outputs.run == 'true'
        run: nix build --print-build-logs .#checks.x86_64-linux.attiny85-clippy
      - name: Check licenses, bans, and sources with cargo-deny
        if: steps.gate.outputs.run == 'true' && (success() || failure())
        run: nix build --print-build-logs .#checks.x86_64-linux.attiny85-deny
      - name: Audit dependencies for security vulnerabilities with cargo-audit
        if: steps.gate.outputs.run == 'true' && (success() || failure())
        run: nix build --print-build-logs .#checks.x86_64-linux.attiny85-audit
