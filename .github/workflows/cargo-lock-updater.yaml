name: Cargo Lock Updater

"on":
  schedule:
    # Once a month on the 5th
    - cron: "0 0 5 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cargo-lock-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Update ATtiny85 Cargo lock file
        run: nix develop ../..#attiny85 --command cargo update
        working-directory: boards/attiny85
      - name: Update Pico Cargo lock file
        run: nix develop ../..#pico --command cargo update
        working-directory: boards/pico
      - name: Update QT Py CH32V203 Cargo lock file
        run: nix develop ../..#qt-py-ch32v203 --command cargo update
        working-directory: boards/qt-py-ch32v203
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          assignees: ${{ github.repository_owner }}
          branch: "update/cargo-lock"
          commit-message: "chore(deps): Update Cargo lock files"
          labels: |
            automated
            dependencies
          title: "chore(deps): Update Cargo lock files"
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        # Use the PAT so that the merge triggers the push workflows on main.
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
